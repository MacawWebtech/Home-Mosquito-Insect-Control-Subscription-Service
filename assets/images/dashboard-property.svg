<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="Figtree, system-ui, sans-serif">
  <defs>
    <pattern id="grass" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#cfe6c4"/>
      <path d="M6 20l2-6M18 10l2-6M24 24l1-5" stroke="#b5d6a6" stroke-width="2" stroke-linecap="round"/>
    </pattern>
    <pattern id="treated" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#1e7b3c" fill-opacity=".16"/>
      <path d="M0 0V14" stroke="#1e7b3c" stroke-opacity=".45" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="#e9f1e3"/>
  <!-- street -->
  <rect y="640" width="1200" height="110" fill="#d7ddd3"/>
  <path d="M0 695H1200" stroke="#fff" stroke-width="6" stroke-dasharray="40 30"/>
  <!-- lot -->
  <rect x="90" y="60" width="1020" height="560" rx="18" fill="url(#grass)" stroke="#14532d" stroke-width="4" stroke-dasharray="18 12"/>
  <!-- treated shrub / fence-line zones -->
  <rect x="110" y="80" width="980" height="56" rx="14" fill="url(#treated)"/>
  <rect x="110" y="136" width="56" height="464" rx="14" fill="url(#treated)"/>
  <rect x="1034" y="136" width="56" height="464" rx="14" fill="url(#treated)"/>
  <!-- driveway -->
  <rect x="170" y="430" width="150" height="210" fill="#e4e6df"/>
  <!-- house + perimeter band -->
  <rect x="290" y="250" width="420" height="250" rx="10" fill="none" stroke="#f2a30f" stroke-width="22" stroke-opacity=".75"/>
  <rect x="300" y="260" width="400" height="230" rx="6" fill="#f6efe3" stroke="#8b7a62" stroke-width="3"/>
  <path d="M300 375H700M500 260V490" stroke="#cdbfa8" stroke-width="3"/>
  <text x="500" y="384" text-anchor="middle" font-size="26" font-weight="700" fill="#5b4d3a">House</text>
  <!-- patio + pool -->
  <rect x="740" y="270" width="250" height="200" rx="8" fill="#ece8df" stroke="#c9c1b2" stroke-width="2"/>
  <rect x="770" y="300" width="190" height="140" rx="40" fill="#cfe9dc" stroke="#7fb79a" stroke-width="4"/>
  <path d="M800 350q20-12 40 0t40 0 40 0M800 390q20-12 40 0t40 0 40 0" fill="none" stroke="#9ccbb2" stroke-width="3"/>
  <text x="865" y="463" text-anchor="middle" font-size="20" font-weight="600" fill="#5a655f">Pool</text>
  <!-- play set (skipped) -->
  <rect x="210" y="170" width="120" height="70" rx="8" fill="#fff" fill-opacity=".7" stroke="#5a655f" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="270" y="212" text-anchor="middle" font-size="18" font-weight="600" fill="#5a655f">Play set</text>
  <!-- trees -->
  <g fill="#3f8f4f" stroke="#2c6b39" stroke-width="3">
    <circle cx="420" cy="180" r="38"/><circle cx="640" cy="175" r="30"/><circle cx="990" cy="550" r="40"/><circle cx="820" cy="560" r="28"/>
  </g>
  <!-- standing water spot -->
  <circle cx="560" cy="560" r="20" fill="#f2a30f"/>
  <path d="M560 548c6 8 8 12 8 15a8 8 0 0 1-16 0c0-3 2-7 8-15z" fill="#1b1f1d"/>
  <!-- legend -->
  <g transform="translate(110 30)" font-size="18" font-weight="600" fill="#1b1f1d">
    <rect x="0" y="-14" width="22" height="16" rx="4" fill="url(#treated)" stroke="#1e7b3c"/><text x="30" y="0">Barrier zones</text>
    <rect x="180" y="-14" width="22" height="16" rx="4" fill="#f2a30f" fill-opacity=".75"/><text x="210" y="0">Perimeter band</text>
    <circle cx="380" cy="-6" r="9" fill="#f2a30f"/><text x="396" y="0">Larvicide</text>
    <rect x="510" y="-14" width="22" height="16" rx="4" fill="none" stroke="#5a655f" stroke-width="2" stroke-dasharray="4 3"/><text x="540" y="0">Skipped</text>
  </g>
</svg>
