<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | YardShield</title>
  <meta name="description" content="Forgot your YardShield password? Enter the email on your account and we will send you a secure link to reset it and get back into your customer portal fast.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#1e7b3c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)">
  <!-- TODO: replace yardshield.example with your domain -->
  <link rel="canonical" href="https://www.yardshield.example/pages/forgot-password.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="YardShield">
  <meta property="og:title" content="Reset Password | YardShield">
  <meta property="og:description" content="Forgot your YardShield password? Enter the email on your account and we will send you a secure link to reset it and get back into your customer portal fast.">
  <meta property="og:url" content="https://www.yardshield.example/pages/forgot-password.html">
  <meta property="og:image" content="https://images.unsplash.com/photo-1784828985296-64d1d85c1454?w=1200&h=900&fit=crop&crop=entropy&fm=jpg&q=72">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/images/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">

  <!-- Theme + direction before first paint (prevents a flash of the wrong theme) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ys-theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', t);
        if (localStorage.getItem('ys-dir') === 'rtl') document.documentElement.setAttribute('dir', 'rtl');
      } catch (e) {}
    })();
  </script>

  <!-- Fonts: Bricolage Grotesque (headings) + Figtree (body) -->
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap">

  <!-- Bootstrap 5.3.3 (RTL build is swapped in automatically when dir="rtl") -->
  <link id="bootstrap-css" rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
  <script>
    if (document.documentElement.getAttribute('dir') === 'rtl') document.getElementById('bootstrap-css').href = '../assets/vendor/bootstrap/css/bootstrap.rtl.min.css';
  </script>
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">

  <!-- Template styles -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <main id="main" class="auth-wrap" tabindex="-1">
    <div class="auth-tools"><button type="button" class="icon-btn dir-btn" data-dir-toggle aria-pressed="false" title="Switch text direction (preview Arabic/Hebrew layout)"><span data-dir-label>RTL</span><span class="visually-hidden"> layout</span></button><button type="button" class="icon-btn" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode"><i class="bi bi-moon-stars" aria-hidden="true"></i></button></div>
    <div class="auth-panel">
      <div class="auth-card">
        <div class="auth-head">
          <a class="navbar-brand auth-brand" href="index.html" aria-label="YardShield — Mosquito &amp; Insect Control, home"><img class="brand-logo brand-logo-dark" src="../assets/images/logo.png" alt="" width="600" height="201"><img class="brand-logo brand-logo-light" src="../assets/images/logo-light.png" alt="" width="600" height="201"></a>
          <h1 class="h2 mb-2">Reset your password</h1>
          <p class="text-muted mb-0">Enter your email and we&rsquo;ll send a reset link.</p>
        </div>
        <form class="needs-validation" novalidate aria-label="Reset password">
          <div class="mb-3"><label for="f-email" class="form-label">Email</label><input id="f-email" type="email" class="form-control" autocomplete="email" required><div class="invalid-feedback"></div></div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Send reset link</button>
          <div class="form-success alert alert-success align-items-center gap-2 mt-3 mb-0" role="status" tabindex="-1"><i class="bi bi-envelope-check" aria-hidden="true"></i>If that email has an account, a reset link is on its way.</div>
          <p class="text-center mt-4 mb-0"><a href="login.html" class="fw-bold"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to log in</a></p>
        </form>
      </div>
    </div>
    <div class="auth-media" aria-hidden="false">
      <picture><img src="../assets/images/warm.jpg" alt="Fenced backyard with a pergola and patio furniture" width="1200" height="1400" loading="lazy" decoding="async"></picture>
      <div class="overlay"><p class="h3 mb-2" style="color:#fff">Locked out? It happens.</p><p class="mb-0" style="color:#e4f4e8">Your visits keep running while you reset.</p></div>
    </div>
  </main>

  <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
</body>
</html>
