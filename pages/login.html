  <!-- Theme + direction before first paint (prevents a flash of the wrong theme) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ys-theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', t);
        if (localStorage.getItem('ys-dir') === 'rtl') document.documentElement.setAttribute('dir', 'rtl');
      } catch (e) {}
    })();
  </script>

  <!-- Fonts: Bricolage Grotesque (headings) + Figtree (body) -->
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap">

  <!-- Bootstrap 5.3.3 (RTL build is swapped in automatically when dir="rtl") -->
  <link id="bootstrap-css" rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
  <script>
    if (document.documentElement.getAttribute('dir') === 'rtl') document.getElementById('bootstrap-css').href = '../assets/vendor/bootstrap/css/bootstrap.rtl.min.css';
  </script>
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">

<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <main id="main" class="auth-wrap" tabindex="-1">
    <div class="auth-panel">
      <div class="auth-card">
        <div class="d-flex justify-content-between align-items-center mb-5"><a class="navbar-brand " href="index.html" aria-label="YardShield home"><svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <path d="M20 2 L35 8 V19 C35 29 28 35 20 38 C12 35 5 29 5 19 V8 Z" fill="var(--ys-primary)"/>
            <path d="M12 24 C16 15 24 13 29 12 C27 19 22 25 13 26 Z" fill="#fff"/>
            <path d="M12 26 L20 18" stroke="var(--ys-primary)" stroke-width="2" stroke-linecap="round"/>
          </svg><span>YardShield</span></a><div class="d-flex gap-2"><button type="button" class="icon-btn " data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode"><i class="bi bi-moon-stars" aria-hidden="true"></i></button></div></div>
        <h1 class="h2 mb-2">Welcome back</h1>
        <p class="text-muted mb-4">Log in to manage your yard treatments.</p>
        <form class="needs-validation" novalidate data-redirect="dashboard.html" aria-label="Log in">
          <div class="alert alert-danger d-none" data-form-summary role="alert"></div>
          <div class="mb-3"><label for="l-email" class="form-label">Email</label><input id="l-email" type="email" class="form-control" autocomplete="email" required><div class="invalid-feedback"></div></div>
          <div class="mb-2"><div class="d-flex justify-content-between"><label for="l-pass" class="form-label">Password</label><a href="forgot-password.html" class="small fw-semibold">Forgot password?</a></div>
            <div class="password-wrap"><input id="l-pass" type="password" class="form-control" autocomplete="current-password" required minlength="8"><button type="button" class="toggle-pass" aria-label="Show password" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button></div><div class="invalid-feedback"></div></div>
          <div class="form-check mb-3"><input id="l-remember" class="form-check-input" type="checkbox"><label for="l-remember" class="form-check-label">Keep me signed in</label></div>
          <!-- TODO: POST to your auth endpoint; remove data-redirect when wired -->
          <button class="btn btn-primary btn-lg w-100" type="submit">Log in</button>
          <p class="small text-muted text-center my-3">or</p>
          <button class="btn btn-ghost w-100 mb-4" type="button" onclick="window.location.href='dashboard.html'"><i class="bi bi-google" aria-hidden="true"></i>Continue with Google</button>
          <p class="text-center mb-0">New to YardShield? <a href="register.html" class="fw-bold">Create an account</a></p>
          <p class="text-center small text-muted mt-2 mb-0">Demo: any email + 8-character password. <a href="admin.html">Admin demo</a></p>
        </form>
      </div>
    </div>
    <div class="auth-media" aria-hidden="false">
      <picture><source type="image/webp" srcset="https://images.unsplash.com/photo-1784454793008-3d6e632db3d7?w=480&amp;h=560&amp;fit=crop&amp;crop=entropy&amp;fm=webp&amp;q=72 480w, https://images.unsplash.com/photo-1784454793008-3d6e632db3d7?w=800&amp;h=933&amp;fit=crop&amp;crop=entropy&amp;fm=webp&amp;q=72 800w, https://images.unsplash.com/photo-1784454793008-3d6e632db3d7?w=1200&amp;h=1400&amp;fit=crop&amp;crop=entropy&amp;fm=webp&amp;q=72 1200w" sizes="(min-width: 1024px) 50vw, 100vw"><img src="https://images.unsplash.com/photo-1784454793008-3d6e632db3d7?w=1200&amp;h=1400&amp;fit=crop&amp;crop=entropy&amp;fm=jpg&amp;q=72" srcset="https://images.unsplash.com/photo-1784454793008-3d6e632db3d7?w=480&amp;h=560&amp;fit=crop&amp;crop=entropy&amp;fm=jpg&amp;q=72 480w, https://images.unsplash.com/photo-1784454793008-3d6e632db3d7?w=800&amp;h=933&amp;fit=crop&amp;crop=entropy&amp;fm=jpg&amp;q=72 800w, https://images.unsplash.com/photo-1784454793008-3d6e632db3d7?w=1200&amp;h=1400&amp;fit=crop&amp;crop=entropy&amp;fm=jpg&amp;q=72 1200w" sizes="(min-width: 1024px) 50vw, 100vw" alt="Backyard shelter with string lights and outdoor furniture at dusk" width="1200" height="1400" loading="lazy" decoding="async" onerror="this.onerror=null;var s=this.parentNode.querySelector('source');if(s)s.remove();this.removeAttribute('srcset');this.src='../assets/images/auth-login.jpg'"></picture>
      <div class="overlay"><p class="h3 mb-2" style="color:#fff">&ldquo;I check the app, see the next visit, and forget about it.&rdquo;</p><p class="mb-0" style="color:#e4f4e8">Danielle R., Atlanta</p></div>
    </div>
  </main>
